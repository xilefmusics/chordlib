[package]
name = "chordlib"
version = "0.17.0"
edition = "2024"
description = "Work with chord-and-lyrics songs: parse, transform, and render them to multiple formats"
license = "AGPL-3.0-only"
repository = "https://github.com/xilefmusics/chordlib"
homepage = "https://github.com/xilefmusics/chordlib"
documentation = "https://docs.rs/chordlib"
readme = "README.md"
keywords = ["chords", "lyrics", "guitar", "chordpro", "songs"]
categories = ["multimedia::audio", "command-line-utilities"]

[dependencies]
clap = { version = "4.6.1", features = ["derive"], optional = true }
scraper = { version = "0.27.0", optional = true }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
serde_yaml = "0.9.34"
askama = "0.16.0"
lazy_static = "1.5.0"
base64 = "0.22.1"
encoding_rs = "0.8.35"
prost = "0.14.1"
uuid = { version = "1.18.1", features = ["v5"] }
unicode-width = "0.2.0"
pdf_oxide = { version = "=0.3.78", default-features = false }
# Constrain pdf_oxide's range to the office_oxide API version it currently compiles against.
office_oxide = { version = "=0.1.9", default-features = false }

[features]
html = ["scraper"]
bin = ["clap"]

[[bin]]
name = "chordlib"
path = "src/main.rs"
required-features = ["bin"]

[package.metadata.docs.rs]
all-features = true
