[package]
name = "chordlib"
version = "0.1.0"
edition = "2021"
description = "Work with chord-and-lyrics songs: parse, transform, and render them to multiple formats"
license = "GPL-3.0-only"
repository = "https://github.com/xilefmusics/chordlib"
homepage = "https://github.com/xilefmusics/chordlib"
documentation = "https://docs.rs/chordlib"
readme = "README.md"
keywords = ["chords", "lyrics", "guitar", "chordpro", "songs"]
categories = ["multimedia::audio", "command-line-utilities"]

[dependencies]
clap = { version = "4.5.38", features = ["derive"], optional = true }
reqwest = { version = "0.12.15", features = ["blocking"], optional = true }
scraper = { version = "0.19.1", optional = true }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
askama = "0.14.0"
lazy_static = "1.5.0"

[features]
download = ["reqwest"]
html = ["scraper"]
bin = ["clap"]

[[bin]]
name = "chordlib"
path = "src/main.rs"
required-features = ["bin"]

[package.metadata.docs.rs]
all-features = true
