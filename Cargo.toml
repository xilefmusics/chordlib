[package]
name = "chordlib"
version = "0.17.0"
edition = "2024"
rust-version = "1.89"
description = "Work with chord-and-lyrics songs: parse, transform, and render them to multiple formats"
license = "AGPL-3.0-only"
repository = "https://github.com/xilefmusics/chordlib"
homepage = "https://github.com/xilefmusics/chordlib"
documentation = "https://docs.rs/chordlib"
readme = "README.md"
keywords = ["chords", "lyrics", "guitar", "chordpro", "songs"]
categories = ["multimedia::audio", "command-line-utilities"]

[dependencies]
clap = { version = "4.6.7", features = ["derive"], optional = true }
scraper = { version = "0.29.0", optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_yaml = { package = "noyalib-serde-yaml", version = "=0.0.58" }
askama = "0.16.1"
lazy_static = "1.5.1"
base64 = "0.23.1"
noyalib = { version = "=0.0.58", default-features = false, features = ["std", "compat-serde-yaml"] }
encoding_rs = "0.8.42"
prost = "0.14.4"
uuid = { version = "1.28.0", features = ["v5"] }
unicode-width = "0.2.2"
pdf_oxide = { version = "=0.3.78", default-features = false }
# Pin to a release compatible with pdf_oxide's DocumentIR API.
office_oxide = { version = "=0.1.15", default-features = false }

[features]
html = ["scraper"]
bin = ["clap"]

[[bin]]
name = "chordlib"
path = "src/main.rs"
required-features = ["bin"]

[package.metadata.docs.rs]
all-features = true
