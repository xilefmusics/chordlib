[package]
name = "chordlib"
version = "0.1.0"
edition = "2021"

[dependencies]
clap = { version = "4.5.38", features = ["derive"], optional = true }
reqwest = { version = "0.12.15", features = ["blocking"], optional = true }
scraper = { version = "0.19.1", optional = true }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
askama = "0.14.0"
lazy_static = "1.5.0"

[features]
download = ["reqwest"]
html = ["scraper"]
bin = ["clap"]
